<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stenciled Spec Grammar</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    background: #f4f5fa; color: #0a0a0f;
    font-family: 'Inter', sans-serif; padding: 32px 48px;
  }
  .hazard-bar {
    height: 14px;
    background: repeating-linear-gradient(45deg, #4b53a4, #4b53a4 16px, #ffffff 16px, #ffffff 32px);
    border: 2px solid #0a0a0f; margin-bottom: 20px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 2px solid #0a0a0f; padding: 18px 28px; margin-bottom: 24px;
  }
  .quote-logo { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: #4b53a4; }
  .tag-pill { background: #4b53a4; color: #fff; padding: 10px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
  .main-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; height: 520px; }
  .spec-plate {
    background: #fff; border: 2px solid #0a0a0f; padding: 40px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .spec-plate h1 { font-size: 86px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
  .spec-plate h2 { font-size: 28px; color: #4b53a4; font-weight: 700; margin-top: 16px; }
  .cutout-crate {
    background: #4b53a4; border: 2px solid #0a0a0f; color: #fff;
    padding: 36px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .cutout-crate h3 { font-size: 32px; font-family: 'JetBrains Mono', monospace; }
  .stats-strip {
    margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
  }
  .stat-box { background: #fff; border: 2px solid #0a0a0f; padding: 20px; font-family: 'JetBrains Mono', monospace; }
  .stat-box strong { font-size: 36px; color: #4b53a4; display: block; }
</style>
</head>
<body>
  <div class="hazard-bar"></div>
  <header>
    <div class="quote-logo">"HYBRID ELECTRO MECHANICAL"</div>
    <div class="tag-pill">"REQUEST TENDER" [↗]</div>
  </header>
  <div class="main-grid">
    <div class="spec-plate">
      <div>
        <h1>"MEP SYSTEMS"</h1>
        <h2>"ENGINEERING EXCELLENCE. DELIVERING RELIABILITY."</h2>
      </div>
      <div class="tag-pill" style="align-self:flex-start;">"EXPLORE 200+ PROJECTS"</div>
    </div>
    <div class="cutout-crate">
      <h3>"PLANT CUTOUT ASSEMBLY"</h3>
      <div style="height:320px; border:2px dashed #fff; display:grid; place-items:center; font-size:24px; font-weight:700;">"CUTOUT PHOTO PLATE"</div>
    </div>
  </div>
  <div class="stats-strip">
    <div class="stat-box"><strong>"200+"</strong>PROJECTS</div>
    <div class="stat-box"><strong>"30+"</strong>CLIENTS</div>
    <div class="stat-box"><strong>"5+"</strong>YEARS</div>
    <div class="stat-box"><strong>"98%"</strong>SATISFACTION</div>
  </div>
</body>
</html>
