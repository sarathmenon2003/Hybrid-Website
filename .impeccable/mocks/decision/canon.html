<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corporate MEP Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    background: #f4f5fa; color: #111827; font-family: 'Inter', sans-serif;
  }
  header {
    background: #ffffff; padding: 22px 80px; display: flex;
    justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb;
  }
  .logo { font-size: 24px; font-weight: 700; color: #4b53a4; }
  .btn { background: #4b53a4; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
  .hero {
    padding: 72px 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center;
  }
  .hero h1 { font-size: 52px; line-height: 1.15; margin-bottom: 20px; }
  .hero p { font-size: 18px; color: #4b5563; margin-bottom: 32px; line-height: 1.6; }
  .hero-img {
    height: 420px; background: #ffffff; border-radius: 16px; border: 1px solid #e5e7eb;
    display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #4b53a4;
  }
  .stats {
    margin: 0 80px; background: #4b53a4; color: #fff; border-radius: 12px;
    padding: 36px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
  }
  .stats strong { font-size: 40px; display: block; }
</style>
</head>
<body>
  <header>
    <div class="logo">HYBRID ELECTRO MECHANICAL L.L.C</div>
    <div class="btn">Contact Us</div>
  </header>
  <div class="hero">
    <div>
      <h1>Engineering Excellence. Delivering Reliability.</h1>
      <p>Specialized MEP contracting company in the UAE delivering electrical, low current, plumbing, and HVAC solutions.</p>
      <div class="btn" style="display:inline-block;">Explore Projects</div>
    </div>
    <div class="hero-img">CUTOUT PLANT IMAGE</div>
  </div>
  <div class="stats">
    <div><strong>200+</strong>Projects</div>
    <div><strong>30+</strong>Clients</div>
    <div><strong>5+</strong>Years</div>
    <div><strong>98%</strong>Satisfaction</div>
  </div>
</body>
</html>
